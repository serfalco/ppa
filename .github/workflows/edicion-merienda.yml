name: PPA - Ediciones Diarias

on:
  schedule:
    - cron: '0 9 * * *'    # Desayuno 🧉 — 06:00 ARG (UTC-3)
    - cron: '15 20 * * *'  # Merienda ☕ — 17:15 ARG (UTC-3)
  workflow_dispatch:
    inputs:
      edicion:
        description: 'Edición a generar'
        required: false
        default: 'auto'
        type: choice
        options: [auto, desayuno, merienda]
      simulacro_fallo:
        description: 'Simulacro: hacer fallar un paso tolerado para probar la alarma'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'si']

permissions:
  contents: write
  issues: write

jobs:
  generar-edicion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install feedparser requests pandas openpyxl xlrd

      - name: Detectar edición
        id: edicion
        run: |
          HORA=$(date -u +%H)
          INPUT="${{ github.event.inputs.edicion }}"
          if [ "$INPUT" = "desayuno" ]; then NOMBRE="Desayuno"; ICONO="🧉"
          elif [ "$INPUT" = "merienda" ]; then NOMBRE="Merienda"; ICONO="☕"
          elif [ "$HORA" -lt 14 ]; then NOMBRE="Desayuno"; ICONO="🧉"
          else NOMBRE="Merienda"; ICONO="☕"
          fi
          echo "nombre=$NOMBRE" >> $GITHUB_OUTPUT
          echo "icono=$ICONO" >> $GITHUB_OUTPUT
          echo "[PPA] Generando edición: $NOMBRE $ICONO"

      - name: Fetcher - bajar RSS (siempre fresco en edición)
        run: python scripts/fetcher.py --forzar

      - name: Selector - elegir notas
        run: python scripts/selector.py

      - name: Datos económicos
        run: python scripts/datos_economicos.py

      - name: Histórico acumulativo
        id: historico
        run: python scripts/historico.py
        continue-on-error: true

      - name: Generador - Pulso del Día
        id: pulso
        run: python scripts/generador_pulso.py
        continue-on-error: true

      - name: Resumidor - resúmenes con Gemini
        id: resumidor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/resumidor.py
        continue-on-error: true

      - name: Generador - La Data del Día
        run: python scripts/generador_la_data.py

      - name: Generador - REM
        id: rem
        run: python scripts/generador_rem.py
        continue-on-error: true

      - name: Generador - Informes
        id: informes
        run: python scripts/generador_informes.py
        continue-on-error: true

      - name: Generador - Documentos
        run: python scripts/generador_documentos.py

      - name: Generador - Columnas
        run: python scripts/generador_columnas.py

      - name: Generador - TXT-Stream
        run: python scripts/generador_stream.py

      - name: Generador - EconoTuits
        id: tuits
        run: python scripts/generador_tuits.py
        continue-on-error: true

      - name: Generador - Tablero PPA
        id: tablero
        run: python scripts/generador_tablero.py
        continue-on-error: true

      - name: Generador - TCRM histórico
        id: tcrm
        run: python scripts/generador_tcrm.py
        continue-on-error: true

      - name: Generador - Acerca de
        id: acerca
        run: python scripts/generador_acerca.py
        continue-on-error: true

      - name: Generador - Home portal
        env:
          PPA_EDICION_NOMBRE: ${{ steps.edicion.outputs.nombre }}
          PPA_EDICION_ICONO: ${{ steps.edicion.outputs.icono }}
        run: python scripts/generador_home.py

      - name: Exportar config de fuentes
        id: config
        run: python scripts/exportar_config.py
        continue-on-error: true

      - name: Simulacro de fallo
        # No corre nunca sola: solo con el input en "si", que únicamente se
        # puede pasar a mano. En el cron el input viene vacío y el paso queda
        # skipped, que no cuenta como caída.
        #
        # Existe porque una alarma que nunca se probó no es una alarma. Con
        # esto se puede verificar el aviso entero —outcome, issue, dedupe— sin
        # editar el workflow ni esperar a que algo se rompa de verdad.
        id: simulacro
        if: inputs.simulacro_fallo == 'si'
        continue-on-error: true
        run: |
          echo "Simulacro: fallando a propósito para probar la alarma."
          exit 1

      - name: Avisar si algún paso tolerado se cayó
        # Los pasos de arriba llevan continue-on-error para que una pieza rota
        # no impida publicar la edición. El costo es que GitHub reporta el paso
        # como success igual: el 12/08/2026 el REM murió con un NameError, el
        # job quedó verde, el paso quedó verde, y el único rastro era el
        # traceback en el log. Ningún monitoreo por estado podía verlo.
        #
        # outcome sí guarda el resultado real, así que acá se juntan y se avisa.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CAIDOS=""
          if [ "${{ steps.simulacro.outcome }}" = "failure" ]; then CAIDOS="$CAIDOS Simulacro de fallo"; fi
          if [ "${{ steps.historico.outcome }}" = "failure" ]; then CAIDOS="$CAIDOS Histórico acumulativo"; fi
          if [ "${{ steps.pulso.outcome }}" = "failure" ]; then CAIDOS="$CAIDOS Generador - Pulso del Día"; fi
          if [ "${{ steps.resumidor.outcome }}" = "failure" ]; then CAIDOS="$CAIDOS Resumidor - resúmenes con Gemini"; fi
          if [ "${{ steps.rem.outcome }}" = "failure" ]; then CAIDOS="$CAIDOS Generador - REM"; fi
          if [ "${{ steps.informes.outcome }}" = "failure" ]; then CAIDOS="$CAIDOS Generador - Informes"; fi
          if [ "${{ steps.tuits.outcome }}" = "failure" ]; then CAIDOS="$CAIDOS Generador - EconoTuits"; fi
          if [ "${{ steps.tablero.outcome }}" = "failure" ]; then CAIDOS="$CAIDOS Generador - Tablero PPA"; fi
          if [ "${{ steps.tcrm.outcome }}" = "failure" ]; then CAIDOS="$CAIDOS Generador - TCRM histórico"; fi
          if [ "${{ steps.acerca.outcome }}" = "failure" ]; then CAIDOS="$CAIDOS Generador - Acerca de"; fi
          if [ "${{ steps.config.outcome }}" = "failure" ]; then CAIDOS="$CAIDOS Exportar config de fuentes"; fi
          if [ -z "$CAIDOS" ]; then
            echo "Todos los pasos tolerados terminaron bien."
            exit 0
          fi
          echo "::warning::Pasos caídos:$CAIDOS"
          TITULO="⚠ Pasos caídos en la edición —$(date -u '+%Y-%m-%d')"
          # Una edición por día ya avisa; dos avisos del mismo día son ruido.
          YA=$(gh issue list --state open --label alerta \
                 --json title --jq '.[].title' | grep -Fx "$TITULO" || true)
          if [ -n "$YA" ]; then
            echo "Ya hay un aviso abierto para hoy."
            exit 0
          fi
          # La etiqueta tiene que existir o gh issue create aborta entero y no
          # crea nada. Pasó: las cinco vías de alerta del repo la usaban y
          # ninguna había podido avisar nunca. Crearla acá es idempotente y
          # deja el workflow andando en un clon nuevo.
          gh label create alerta --color d73a4a \
            --description "Avisos automáticos del pipeline" 2>/dev/null || true
          gh issue create \
            --title "$TITULO" \
            --body "La edición se publicó, pero estos pasos fallaron y quedaron tapados por \`continue-on-error\`:$CAIDOS

          El job figura en verde: \`continue-on-error\` hace que GitHub reporte el paso como \`success\`. El detalle real está en el log de la corrida.

          Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label alerta \
            || echo "::warning::No pude crear el issue de alerta"

      - name: Copiar JSONs al site
        run: |
          mkdir -p site/data
          cp data/*.json site/data/ || true

      - name: Commit cambios
        run: |
          git config user.name "PPA Bot"
          git config user.email "bot@pulsoproductivo.com.ar"
          git add data/ site/
          if ! git diff --staged --quiet; then
            EDICION="${{ steps.edicion.outputs.nombre }}"
            ICONO="${{ steps.edicion.outputs.icono }}"
            git commit -m "Edición ${EDICION} ${ICONO} — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs origin main
            git push
          fi

      # El deploy ya NO usa FTP/Hostinger: al pushear a main, Cloudflare Pages
      # (conectado al repo, directorio de salida: site/) publica automáticamente.

      - name: Alerta si falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La etiqueta tiene que existir o gh issue create aborta entero y no
          # crea nada. Pasó: las cinco vías de alerta del repo la usaban y
          # ninguna había podido avisar nunca. Crearla acá es idempotente y
          # deja el workflow andando en un clon nuevo.
          gh label create alerta --color d73a4a \
            --description "Avisos automáticos del pipeline" 2>/dev/null || true
          gh issue create \
            --title "⚠ Falló la edición ${{ steps.edicion.outputs.nombre }} — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --body "El workflow **Ediciones Diarias** falló. Ver corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label alerta \
            || echo "::warning::No pude crear el issue de alerta"
