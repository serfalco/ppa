name: PPA - Descubrir variables BCRA

# Herramienta de diagnóstico, a mano. No toca el repo ni publica nada:
# solo consulta la API del BCRA y escribe el resultado en el resumen del job.
#
# Para qué: encontrar el ID de una variable de la API BCRA v4 — en particular
# el de COMPRAS NETAS DE DIVISAS (MULC), que hoy se carga a mano desde el panel
# y es lo último que traba la puerta de salida de la Fase A.
#
# Cómo usarlo:
#   Actions → "PPA - Descubrir variables BCRA" → Run workflow → Run.
#   Leer el resumen del job, verificar el valor contra el Informe Monetario
#   Diario y setear MULC_BCRA_ID en scripts/datos_economicos.py.

on:
  workflow_dispatch:
    inputs:
      herramienta:
        description: 'Qué descubrir'
        required: true
        default: 'bcra'
        type: choice
        options: [bcra, feeds]
      filtros:
        description: 'BCRA: palabras a buscar, o "--detalle 47 78" para ver valores. FEEDS: ids a probar (institucionales o de FUENTES.py, ej "fundar"), vacío = todas las institucionales.'
        required: false
        default: 'mulc compra divisas'
        type: string

permissions:
  contents: read

jobs:
  descubrir:
    runs-on: ubuntu-latest
    # El probador de feeds consulta 15 sitios; 5 minutos no alcanzaban.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Descubrir
        id: consulta
        env:
          # Por env y no interpolado en el script: una entrada de
          # workflow_dispatch metida directo en un run es inyección de shell.
          FILTROS: ${{ inputs.filtros }}
          HERRAMIENTA: ${{ inputs.herramienta }}
        run: |
          echo "Herramienta: $HERRAMIENTA · argumentos: $FILTROS"
          # shellcheck disable=SC2086 — se quiere el split en palabras
          if [ "$HERRAMIENTA" = "feeds" ]; then
            python -u scripts/descubrir_feeds.py $FILTROS | tee salida.txt
          else
            python -u scripts/descubrir_bcra.py $FILTROS | tee salida.txt
          fi

      - name: Escribir el resumen del job
        if: always()
        env:
          FILTROS: ${{ inputs.filtros }}
          HERRAMIENTA: ${{ inputs.herramienta }}
        run: |
          {
            if [ "$HERRAMIENTA" = "feeds" ]; then
              echo "## Feeds institucionales vigentes"
            else
              echo "## Variables de la API BCRA v4"
            fi
            echo
            echo "Argumentos: \`$FILTROS\`"
            echo
            echo '```'
            cat salida.txt 2>/dev/null || echo "(sin salida — ver el log del paso anterior)"
            echo '```'
            echo
            if [ "$HERRAMIENTA" = "feeds" ]; then
              echo "### Qué hacer con esto"
              echo
              echo "1. Pegar las líneas sugeridas en \`scripts/FUENTES.py\` — si la fuente ya estaba, es reemplazo de su \`web\`."
              echo "2. Si es institucional y alimenta Documentos, sumar el id a \`FUENTES_INSTITUCIONALES\` en \`scripts/generador_documentos.py\`."
              echo "3. La próxima corrida del fetcher las levanta."
            else
              echo "### Si encontraste el ID del MULC"
              echo
              echo "1. Verificá que el valor coincida con el Informe Monetario Diario del BCRA."
              echo "2. En \`scripts/datos_economicos.py\`, seteá \`MULC_BCRA_ID = <id>\`."
              echo "3. Desde ahí el MULC sale de la API y la carga del panel queda de respaldo."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
