name: PPA - Datos de mercado
# El deploy ya NO usa FTP/Hostinger: al pushear a main, Cloudflare Pages
# (conectado al repo, directorio de salida: site/) publica automáticamente.
on:
  schedule:
    - cron: '0 13-21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: ppa-datos
  cancel-in-progress: false
jobs:
  datos-mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # openpyxl: el ITCRM sale de la planilla del BCRA cuando el cache
          # que deja la edición quedó viejo (ver datos_economicos.obtener_itcrm).
          pip install requests openpyxl
      - name: Actualizar datos de mercado
        run: python scripts/datos_economicos.py --solo-mercado
      - name: Actualizar histórico acumulativo
        run: python scripts/historico.py
      - name: Copiar JSON al site
        run: |
          mkdir -p site/data
          cp data/datos.json site/data/ || true
      - name: Commit si hay cambios
        run: |
          git config user.name "PPA Bot"
          git config user.email "bot@pulsoproductivo.com.ar"
          git add data/ site/data/
          if ! git diff --staged --quiet; then
            git commit -m "Datos de mercado — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs origin main
            git push
          fi
      - name: Alerta si falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La etiqueta tiene que existir o gh issue create aborta entero y no
          # crea nada. Pasó: las cinco vías de alerta del repo la usaban y
          # ninguna había podido avisar nunca. Crearla acá es idempotente y
          # deja el workflow andando en un clon nuevo.
          gh label create alerta --color d73a4a \
            --description "Avisos automáticos del pipeline" 2>/dev/null || true
          gh issue create \
            --title "⚠ Falló Datos de mercado — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --body "El workflow **Datos de mercado** falló. Ver corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label alerta \
            || echo "::warning::No pude crear el issue de alerta"
